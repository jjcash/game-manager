[package]
name = "game-manager"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "Local-first Windows game library, launcher, and mod manager"
edition = "2024"
default-run = "game-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "game_manager_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

[features]
benchmarks = []

[[bin]]
name = "job-fixtures"
path = "src/bin/job-fixtures.rs"
required-features = ["benchmarks"]

[[bin]]
name = "artwork-fixtures"
path = "src/bin/artwork-fixtures.rs"
required-features = ["benchmarks"]

[[bin]]
name = "library-bench"
path = "src/bin/library-bench.rs"
required-features = ["benchmarks"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
# M1.3C isolated native tests only; already present transitively in Cargo.lock.
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Ioctl"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
