name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    name: Windows quality checks
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false

      - name: Install the project's pinned pnpm
        run: npm install --global (node -p "require('./package.json').packageManager")

      - name: Locate pnpm dependency store
        id: pnpm-store
        run: |
          $storePath = pnpm store path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$storePath" >> $env:GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node-26.12.1-${{ hashFiles('apps/desktop/package.json', 'apps/desktop/pnpm-lock.yaml') }}

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust with rustfmt and Clippy
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy

      # Cache downloaded sources/indexes only; target/, executables and installers
      # are deliberately excluded. All compilation happens in this job's workspace.
      - name: Cache Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: TypeScript type checking
        run: pnpm typecheck

      - name: ESLint (deny warnings)
        run: pnpm lint

      - name: Prettier and Rust formatting
        run: pnpm format:check

      - name: Workflow formatting
        run: pnpm exec prettier --check ../../.github/workflows/ci.yml

      - name: Frontend unit tests
        run: pnpm test

      # Tauri runs the existing beforeBuildCommand (pnpm build), which checks
      # TypeScript and builds production frontend assets once before native build.
      # Build first so Rust checks also work on a clean checkout without dist/.
      - name: Production frontend and native Windows Tauri build
        run: pnpm desktop:build

      - name: Rust Clippy (all targets, deny warnings)
        run: pnpm lint:rust

      - name: Diagnose Windows runner security context
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"

          whoami /user
          # Includes administrator group attributes and the mandatory integrity label.
          whoami /groups
          whoami /priv

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try {
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            $adminEnabled = $principal.IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator
            )
            Write-Host "Administrator role enabled: $adminEnabled"
          } finally {
            $identity.Dispose()
          }

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture |
            Format-List

      - name: Rust unit, integration and documentation tests
        # Probe and verify the child token before fixtures, then require all 12
        # native tests and the unchanged pnpm test:rust command in that context.
        run: ../../.github/scripts/Invoke-M17UnelevatedTests.ps1
